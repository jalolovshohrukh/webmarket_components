<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fe6a00" />

    <!-- Primary -->
    <title>Webmarket Components — 118 reusable React components</title>
    <meta
      name="description"
      content="A reusable, accessible, responsive React component kit. 118 components — owned by your codebase. React 18, Tailwind v3, Radix UI, Recharts. MIT-licensed."
    />
    <meta name="author" content="jalolovshohrukh" />
    <link rel="canonical" href="https://github.com/jalolovshohrukh/webmarket_components" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/jalolovshohrukh/webmarket_components" />
    <meta property="og:title" content="Webmarket Components" />
    <meta
      property="og:description"
      content="A reusable, accessible, responsive React component kit. 118 components — owned by your codebase."
    />
    <meta property="og:site_name" content="Webmarket Components" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Webmarket Components" />
    <meta
      name="twitter:description"
      content="A reusable, accessible, responsive React component kit. 118 components — owned by your codebase."
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Favicon (uses the wordmark asset already in the kit) -->
    <link rel="icon" type="image/png" href="/src/assets/webmarket-logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/webmarket-logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 2rem;">
        Webmarket Components needs JavaScript enabled to render the docs site.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
